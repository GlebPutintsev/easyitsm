{{- $db := .Values.database -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "easyitsm.fullname" . }}-core
  labels:
    {{- include "easyitsm.labels" . | nindent 4 }}
data:
  # Только несекретные параметры. Пароли и лицензия монтируются файлами (SEC-36).
  SPRING_CONFIG_IMPORT: "optional:configtree:/run/secrets/easyitsm/"
  SPRING_PROFILES_ACTIVE: "prod"
  EASYITSM_DB_URL: {{ printf "jdbc:postgresql://%s:%v/%s?sslmode=%s" (include "easyitsm.dbHost" .) $db.port $db.name $db.sslMode | quote }}
  EASYITSM_TENANCY_MODE: {{ .Values.tenancy.mode | quote }}
  {{- with .Values.tenancy.defaultTenantId }}
  EASYITSM_TENANCY_DEFAULT_TENANT_ID: {{ . | quote }}
  {{- end }}
  {{- if .Values.license.existingSecret }}
  EASYITSM_LICENSE_FILE: /run/secrets/easyitsm/license/license.json
  {{- end }}
  {{- with .Values.search.opensearch }}
  EASYITSM_SEARCH_OPENSEARCH_ENABLED: {{ .enabled | quote }}
  {{- if .enabled }}
  EASYITSM_SEARCH_OPENSEARCH_URLS: {{ required "search.opensearch.urls обязателен, если OpenSearch включён" .urls | quote }}
  {{- end }}
  {{- with .username }}
  EASYITSM_SEARCH_OPENSEARCH_USERNAME: {{ . | quote }}
  {{- end }}
  EASYITSM_SEARCH_OPENSEARCH_INDEX_PREFIX: {{ .indexPrefix | quote }}
  EASYITSM_SEARCH_OPENSEARCH_SHARDS: {{ .shards | quote }}
  EASYITSM_SEARCH_OPENSEARCH_REPLICAS: {{ .replicas | quote }}
  {{- end }}
  {{- with .Values.attachments.s3 }}
  {{- with .endpoint }}
  EASYITSM_ATTACHMENTS_S3_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- with .publicEndpoint }}
  EASYITSM_ATTACHMENTS_S3_PUBLIC_ENDPOINT: {{ . | quote }}
  {{- end }}
  EASYITSM_ATTACHMENTS_S3_REGION: {{ .region | quote }}
  EASYITSM_ATTACHMENTS_S3_BUCKET: {{ .bucket | quote }}
  {{- with .quarantineBucket }}
  EASYITSM_ATTACHMENTS_S3_QUARANTINE_BUCKET: {{ . | quote }}
  {{- end }}
  EASYITSM_ATTACHMENTS_S3_PATH_STYLE: {{ .pathStyle | quote }}
  EASYITSM_ATTACHMENTS_S3_CREATE_BUCKET: {{ .createBucket | quote }}
  {{- end }}
  EASYITSM_ATTACHMENTS_ANTIVIRUS_MODE: {{ .Values.attachments.antivirus.mode | quote }}
  {{- if eq .Values.attachments.antivirus.mode "clamd" }}
  EASYITSM_ATTACHMENTS_ANTIVIRUS_HOST: {{ include "easyitsm.clamavHost" . | quote }}
  EASYITSM_ATTACHMENTS_ANTIVIRUS_PORT: {{ .Values.attachments.antivirus.port | quote }}
  {{- end }}
  # Адрес интерфейса для ссылок в письмах и push.
  EASYITSM_PUBLIC_URL: {{ default (printf "%s://%s" (ternary "https" "http" (not (empty .Values.ingress.tls))) .Values.ingress.host) .Values.publicUrl | quote }}
  {{- with .Values.mail.smtp }}
  {{- with .host }}
  EASYITSM_SMTP_HOST: {{ . | quote }}
  {{- end }}
  {{- with .port }}
  EASYITSM_SMTP_PORT: {{ . | quote }}
  {{- end }}
  {{- with .security }}
  EASYITSM_SMTP_SECURITY: {{ . | quote }}
  {{- end }}
  {{- with .fromAddress }}
  EASYITSM_SMTP_FROM: {{ . | quote }}
  {{- end }}
  {{- end }}
  MANAGEMENT_SERVER_PORT: "8081"
  SERVER_PORT: "8080"
  # Заголовки X-Forwarded-* от Ingress: правильные адреса клиентов в журнале аудита.
  SERVER_FORWARD_HEADERS_STRATEGY: framework
  {{- with .Values.audit.siem }}
  {{- if .enabled }}
  EASYITSM_AUDIT_SIEM_ENABLED: "true"
  EASYITSM_AUDIT_SIEM_HOST: {{ required "audit.siem.host обязателен, если audit.siem.enabled" .host | quote }}
  EASYITSM_AUDIT_SIEM_PORT: {{ .port | quote }}
  EASYITSM_AUDIT_SIEM_TRANSPORT: {{ .transport | quote }}
  EASYITSM_AUDIT_SIEM_FORMAT: {{ .format | quote }}
  {{- if .caSecret }}
  EASYITSM_AUDIT_SIEM_CAFILE: /run/secrets/easyitsm/siem/ca.crt
  {{- end }}
  {{- end }}
  {{- end }}
