apiVersion: v1
kind: Service
metadata:
  name: {{ include "easyitsm.fullname" . }}-api
  labels:
    {{- include "easyitsm.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "easyitsm.selector" (list . "api") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "easyitsm.fullname" . }}-web
  labels:
    {{- include "easyitsm.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    {{- include "easyitsm.selector" (list . "web") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
