{{- if not .Values.database.existingSecret }}
{{- if not .Values.postgresql.enabled }}
{{- fail "database.existingSecret обязателен для внешнего PostgreSQL: пароли не задаются в values (SEC-36)" }}
{{- end }}
{{- $name := include "easyitsm.dbSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := dict -}}
{{- if $existing }}{{ $data = $existing.data }}{{ end -}}
# Пароли встроенного PostgreSQL. Генерируются один раз и сохраняются при обновлениях.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "easyitsm.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  app-username: {{ "easyitsm_app" | b64enc }}
  owner-username: {{ "easyitsm_owner" | b64enc }}
  app-password: {{ get $data "app-password" | default (randAlphaNum 32 | b64enc) }}
  owner-password: {{ get $data "owner-password" | default (randAlphaNum 32 | b64enc) }}
  superuser-password: {{ get $data "superuser-password" | default (randAlphaNum 32 | b64enc) }}
{{- end }}
