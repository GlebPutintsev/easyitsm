apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "easyitsm.fullname" . }}-web
  labels:
    {{- include "easyitsm.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      {{- include "easyitsm.selector" (list . "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "easyitsm.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: {{ include "easyitsm.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- include "easyitsm.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "easyitsm.podSecurityContext" (dict "uid" 65532) | nindent 8 }}
      containers:
        - name: web
          image: {{ include "easyitsm.image" (list . .Values.image.web) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "easyitsm.containerSecurityContext" . | nindent 12 }}
          {{- with include "easyitsm.filesOrigin" . }}
          env:
            # Браузер грузит вложения и показывает картинки прямо из хранилища (CSP connect-src, img-src).
            - name: EASYITSM_FILES_ORIGIN
              value: {{ . | quote }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
