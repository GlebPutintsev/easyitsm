{{- if not .Values.appSecret.existingSecret }}
{{- $name := include "easyitsm.appSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := dict -}}
{{- if $existing }}{{ $data = $existing.data }}{{ end -}}
# Ключ шифрования приложения: TOTP и секреты identity, пароли почтовых ящиков, токены ответа в письмах,
# ключ VAPID для push. Генерируется один раз и сохраняется при обновлениях: одинаков у api и worker,
# иначе письма, отправленные worker, не примут ответ на api. Потеря ключа сбрасывает TOTP и пароли ящиков.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "easyitsm.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  secret-key: {{ get $data "secret-key" | default (randBytes 32 | b64enc) }}
{{- end }}
