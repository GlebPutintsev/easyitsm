# Easy ITSM. Значения по умолчанию — пилот на одном узле (раздел 12.1 ТЗ):
# ядро и фоновый обработчик в одном поде, встроенный PostgreSQL.
# Промышленная HA-конфигурация: values-ha.yaml.

global:
  # Реестр-зеркало для офлайн-установки: подменяет реестр во всех образах чарта.
  imageRegistry: ""
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

image:
  pullPolicy: IfNotPresent
  # digest важнее tag. Установщик офлайн-комплекта подставляет digest проверенных образов.
  core:
    repository: ghcr.io/glebputintsev/easyitsm-core
    tag: ""
    digest: ""
  web:
    repository: ghcr.io/glebputintsev/easyitsm-web
    tag: ""
    digest: ""

serviceAccount:
  name: ""

tenancy:
  # SINGLE — контур заказчика, MULTI — облако.
  mode: SINGLE
  # Арендатор инсталляции в режиме SINGLE (UUID). Создаётся мастером настройки.
  defaultTenantId: ""

# Ядро в роли api: REST API и WebSocket.
api:
  replicas: 1
  # На пилоте фоновый обработчик работает в том же процессе. В HA — отдельный Deployment worker.
  workerEnabled: true
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { memory: 2Gi }
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  autoscaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

# Ядро в роли worker: outbox, таймеры SLA, почта, рассылки.
worker:
  enabled: false
  # Больше одной реплики — после блокировки плановых задач (ShedLock), иначе задачи выполняются дважды.
  replicas: 1
  resources:
    requests: { cpu: 250m, memory: 768Mi }
    limits: { memory: 1536Mi }
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Веб-клиент: статический сервер SPA.
web:
  replicas: 1
  # Адрес хранилища файлов для CSP (connect-src, img-src). Пусто — из attachments.s3.publicEndpoint.
  filesOrigin: ""
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { memory: 128Mi }
  nodeSelector: {}
  tolerations: []
  affinity: {}

ingress:
  enabled: true
  className: ""
  host: itsm.example.local
  annotations: {}
  tls:
    # Секрет с сертификатом. Пусто — Ingress без TLS (только для стенда).
    secretName: ""

database:
  # Внешний PostgreSQL. Используется, когда postgresql.enabled=false.
  host: ""
  port: 5432
  name: easyitsm
  # require | verify-full | disable. Для внешней БД в продуктиве — verify-full.
  sslMode: disable
  # Секрет с ключами app-username, app-password, owner-username, owner-password.
  # Пусто при встроенном PostgreSQL — чарт создаст секрет со случайными паролями и сохранит их при обновлениях.
  existingSecret: ""

# Встроенный PostgreSQL для пилота. Не для персональных данных и не для HA (раздел 12.1 ТЗ).
postgresql:
  enabled: true
  image:
    repository: docker.io/library/postgres
    tag: "17-alpine"
    digest: ""
  storage:
    size: 20Gi
    storageClassName: ""
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 2Gi }

# Глобальный поиск (раздел 10 PLAN.md). Без OpenSearch работает запасной поиск в PostgreSQL:
# те же права, но без морфологии синонимов и с меньшей скоростью на больших объёмах.
search:
  opensearch:
    enabled: false
    # Узлы через запятую: https://opensearch-0.example:9200,https://opensearch-1.example:9200
    urls: ""
    username: ""
    # Секрет с ключом password. Пусто — без пароля (только для стенда).
    existingSecret: ""
    indexPrefix: easyitsm-search
    shards: 1
    # В кластере из трёх узлов — 1.
    replicas: 0

# Вложения (TCK-04, SEC-25…27): файлы лежат в S3-совместимом хранилище, браузер грузит и скачивает их
# по коротким подписанным ссылкам, ядро только проверяет и выдаёт ссылки.
attachments:
  s3:
    # Адрес хранилища для ядра (внутренняя сеть).
    endpoint: ""
    # Адрес для браузера в подписанных ссылках — отдельный домен файлов (SEC-25), например https://files.example.ru.
    # Он же попадает в CSP веб-клиента. Пусто — endpoint.
    publicEndpoint: ""
    region: ru-central1
    bucket: easyitsm-files
    # Отдельный бакет карантина. Пусто — префикс quarantine/ в основном бакете.
    quarantineBucket: ""
    pathStyle: true
    # Создать бакеты при старте. В продуктиве бакеты обычно заводит администратор хранилища.
    createBucket: false
    # Секрет с ключами access-key и secret-key.
    existingSecret: ""
  antivirus:
    # clamd — проверка ClamAV по сети; none — без антивируса (файлы помечаются «не проверено»).
    mode: clamd
    # Пусто при clamav.enabled — встроенный сервис чарта.
    host: ""
    port: 3310

# Антивирус ClamAV для проверки вложений. Базы сигнатур есть в образе; обновление — freshclam с зеркала.
clamav:
  enabled: true
  image:
    repository: docker.io/clamav/clamav
    tag: "1.4"
    digest: ""
  # Предел потока на проверку: не меньше предельного размера вложения (100 МБ) с запасом.
  streamMaxLength: 110M
  freshclam:
    enabled: true
    # Офлайн-контур: собственное зеркало баз (cvdupdate, nginx) вместо database.clamav.net.
    # Например http://clamav-mirror.example.local — тогда PrivateMirror, и в networkPolicy.clamavEgress разрешите его.
    privateMirror: ""
    checksPerDay: 12
  resources:
    requests: { cpu: 200m, memory: 1536Mi }
    limits: { memory: 3Gi }
  nodeSelector: {}
  tolerations: []
  affinity: {}
# Адрес интерфейса для ссылок в письмах и push. Пусто — из ingress.host (https, если задан TLS).
publicUrl: ""

appSecret:
  # Секрет с ключом secret-key (32 случайных байта в base64, `openssl rand -base64 32`): шифрование TOTP,
  # паролей почтовых ящиков, токенов ответа в письмах и ключа VAPID. Пусто — чарт создаст и сохранит свой.
  existingSecret: ""

mail:
  # Сервер отправки по умолчанию для всей установки. Администратор арендатора может задать свой в
  # «Управление → Почта». Логин и пароль — через api.extraEnv/worker.extraEnv из секрета
  # (EASYITSM_SMTP_USERNAME, EASYITSM_SMTP_PASSWORD). Исходящий доступ разрешите в networkPolicy.coreEgress.
  smtp:
    host: ""
    port: 587
    security: starttls
    fromAddress: ""
  # Приём писем по SMTP: почтовый сервер организации пересылает письма ящиков поддержки на этот порт.
  # Для IMAP и Microsoft Graph не нужен.
  inboundSmtp:
    enabled: false
    port: 2525
    service:
      type: LoadBalancer
      port: 25
      annotations: {}
    # Сети почтовых серверов, от которых принимаются письма (обязательно при enabled).
    sourceCidrs: []

license:
  # Секрет с ключом license.json — подписанный файл лицензии (ADM-07). Без него работает пробный режим.
  existingSecret: ""

# Журнал аудита (SEC-29…SEC-32): копия записей в SIEM по Syslog с TLS (RFC 5425), тело CEF или JSON.
# Не забудьте разрешить соединение с SIEM в networkPolicy.coreEgress.
audit:
  siem:
    enabled: false
    host: ""
    port: 6514
    # TLS или TCP (TCP без шифрования — только в доверенном сегменте)
    transport: TLS
    # CEF или JSON
    format: CEF
    # Секрет с ключом ca.crt — сертификаты ЦС приёмника. Пусто — доверенные сертификаты образа.
    caSecret: ""

networkPolicy:
  # SEC-35: трафик запрещён по умолчанию, разрешения ниже.
  enabled: true
  # Запрет по умолчанию для всего пространства имён, а не только для подов релиза.
  defaultDenyNamespace: true
  # Откуда приходит внешний трафик: поды Ingress-контроллера.
  ingressController:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ingress-nginx
    podSelector: {}
  # Кто собирает метрики с порта управления 8081.
  monitoring:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    podSelector: {}
  dns:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
  # Сети внешнего PostgreSQL (CIDR), если postgresql.enabled=false.
  databaseCidrs: []
  # Прочие исходящие соединения ядра: почта (SMTP 25/465/587, IMAP 993, Microsoft Graph и Web Push — 443),
  # IdP, S3, SIEM, OpenSearch. Формат — правило egress NetworkPolicy:
  #   - to: [{ ipBlock: { cidr: 10.0.10.25/32 } }]
  #     ports: [{ port: 587, protocol: TCP }]
  coreEgress: []
  # Исходящие соединения freshclam к зеркалу баз ClamAV в том же формате. Пусто — любые адреса на 80 и 443.
  clamavEgress: []

podDisruptionBudget:
  enabled: true
