# Окружение разработки. Запуск: docker compose -f deploy/compose/compose.yaml up -d
# Не для продуктива: поставка — Helm-чарт в deploy/helm (тред DevSecOps).
# Все образы есть для amd64 и arm64 (Apple Silicon).
# Порты наружу меняются переменными, если стандартные заняты, например:
#   EASYITSM_PG_PORT=5433 EASYITSM_VALKEY_PORT=6380 docker compose -f deploy/compose/compose.yaml up -d
# Тогда бэкенду: EASYITSM_DB_URL=jdbc:postgresql://localhost:5433/easyitsm SPRING_DATA_REDIS_PORT=6380.
name: easyitsm-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["${EASYITSM_PG_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s

  valkey:
    image: valkey/valkey:8-alpine
    ports: ["${EASYITSM_VALKEY_PORT:-6379}:6379"]

  # S3 для вложений. MinIO больше не публикует образы на Docker Hub, поэтому эмулятор moto — тот же, что в CI.
  # Принимает любые ключи, корзину ядро создаёт само (create-bucket в профиле dev).
  # Файлы живут в памяти и пропадают при перезапуске контейнера: для разработки этого хватает.
  s3:
    image: motoserver/moto:5.2.5
    environment:
      MOTO_PORT: "9000"
    ports: ["${EASYITSM_S3_PORT:-9000}:9000"]

  # Глобальный поиск с морфологией. Без него ядро ищет в PostgreSQL.
  # docker compose --profile search up -d, затем EASYITSM_SEARCH_OPENSEARCH_ENABLED=true для ядра.
  opensearch:
    image: opensearchproject/opensearch:2.19.2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: [opensearch:/usr/share/opensearch/data]
    profiles: [search]

  # Антивирус для вложений: docker compose --profile av up -d, затем EASYITSM_ATTACHMENTS_ANTIVIRUS_MODE=clamd.
  # Без него в разработке файлы помечаются «не проверено антивирусом».
  # Сборка на Debian: у clamav/clamav (Alpine) нет arm64, а эта работает и на Apple Silicon.
  # Первый старт качает базы сигнатур, clamd отвечает минуты через 2–3.
  clamav:
    image: clamav/clamav-debian:1.4
    environment:
      CLAMD_CONF_StreamMaxLength: 110M
      CLAMD_CONF_MaxFileSize: 110M
    ports: ["3310:3310"]
    profiles: [av]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    # Реалм easyitsm с клиентом приложения и тестовым пользователем sso.user импортируется при старте.
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8180:8080"]
    volumes: [./keycloak:/opt/keycloak/data/import:ro]
    profiles: [sso]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  opensearch:
