# Окружение разработки. Запуск: docker compose -f deploy/compose/compose.yaml up -d
# Не для продуктива: поставка — Helm-чарт в deploy/helm (тред DevSecOps).
name: easyitsm-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s

  valkey:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: easyitsm
      MINIO_ROOT_PASSWORD: easyitsm-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  # Глобальный поиск с морфологией. Без него ядро ищет в PostgreSQL.
  # docker compose --profile search up -d, затем EASYITSM_SEARCH_OPENSEARCH_ENABLED=true для ядра.
  opensearch:
    image: opensearchproject/opensearch:2.19.2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: [opensearch:/usr/share/opensearch/data]
    profiles: [search]

  # Антивирус для вложений: docker compose --profile av up -d, затем EASYITSM_ATTACHMENTS_ANTIVIRUS_MODE=clamd.
  # Без него в разработке файлы помечаются «не проверено антивирусом».
  clamav:
    image: clamav/clamav:1.4
    environment:
      CLAMD_CONF_StreamMaxLength: 110M
      CLAMD_CONF_MaxFileSize: 110M
    ports: ["3310:3310"]
    profiles: [av]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    # Реалм easyitsm с клиентом приложения и тестовым пользователем sso.user импортируется при старте.
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8180:8080"]
    volumes: [./keycloak:/opt/keycloak/data/import:ro]
    profiles: [sso]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  minio:
  opensearch:
