openapi: 3.1.0
info:
  title: Easy ITSM — CMDB
  version: 0.1.0
  description: |
    Модуль cmdb: классы КЕ, КЕ, связи, анализ влияния, загрузка из источников и сверка (CFG-01…09). Общие правила API: ошибки RFC 9457 с `code`,
    `trace_id` и `field`, курсорная пагинация (`limit` до 200), `Idempotency-Key` на создание, `ETag`/`If-Match`
    на изменение. Коды значений в нижнем регистре. Описание решений: docs/api/cmdb-contract.md.
servers:
  - url: /api/v1
security:
  - session: []

tags:
  - name: classes
  - name: cis
  - name: relations
  - name: impact
  - name: ingestion

paths:
  /cmdb/classes:
    get:
      tags: [classes]
      summary: Классы КЕ с унаследованными атрибутами и правилами идентификации
      responses:
        '200':
          description: Все классы арендатора
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/CiClass'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [classes]
      summary: Создать свой класс (CFG, ADM); подкласс наследует уровень и атрибуты родителя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: {type: string, pattern: '^[a-z][a-z0-9_]{1,62}$'}
                name: {type: string}
                parentCode: {type: string}
                layer: {$ref: '#/components/schemas/Layer'}
                isAbstract: {type: boolean}
                attributes: {type: array, items: {$ref: '#/components/schemas/AttributeDef'}}
                identificationRules: {type: array, items: {type: array, items: {type: string}}}
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CiClass'}
        '400':
          description: '`unknown_class`, `invalid_attribute_def`, `duplicate_attribute`, `invalid_rule`, `secret_not_allowed`'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /cmdb/classes/{code}:
    patch:
      tags: [classes]
      summary: Изменить класс (CFG, ADM); attributes — собственные атрибуты целиком
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                active: {type: boolean}
                isAbstract: {type: boolean}
                attributes: {type: array, items: {$ref: '#/components/schemas/AttributeDef'}}
                identificationRules: {type: array, items: {type: array, items: {type: string}}}
      responses:
        '200':
          description: Изменён
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CiClass'}
        '400':
          description: 'Как при создании, а также `system_attribute`, `system_class`, `class_in_use`'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}

  /cmdb/relation-types:
    get:
      tags: [relations]
      summary: Типы связей
      responses:
        '200':
          description: Типы связей арендатора
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/RelationType'}}
    post:
      tags: [relations]
      summary: Создать тип связи (CFG, ADM)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, inverseName, impactDirection]
              properties:
                code: {type: string}
                name: {type: string}
                inverseName: {type: string}
                impactDirection: {type: string, enum: [target_to_source, source_to_target, none]}
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RelationType'}
        '409': {$ref: '#/components/responses/Problem'}

  /cmdb/relation-types/{code}:
    patch:
      tags: [relations]
      summary: Изменить тип связи; у стандартного — только названия
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                inverseName: {type: string}
                impactDirection: {type: string, enum: [target_to_source, source_to_target, none]}
                active: {type: boolean}
      responses:
        '200':
          description: Изменён
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RelationType'}

  /cmdb/cis:
    get:
      tags: [cis]
      summary: Список КЕ с фильтрами (экран 10.13)
      parameters:
        - {name: q, in: query, description: Часть имени без учёта регистра, schema: {type: string}}
        - {name: classCode, in: query, description: Коды классов через запятую, включая подклассы, schema: {type: string}}
        - {name: layer, in: query, description: 'business_service, technical_service, application, infrastructure', schema: {type: string}}
        - {name: status, in: query, description: Через запятую; без фильтра выведенные из эксплуатации скрыты, schema: {type: string}}
        - {name: environment, in: query, schema: {type: string}}
        - {name: criticality, in: query, schema: {type: string}}
        - {name: ownerGroupId, in: query, schema: {type: string, format: uuid}}
        - {name: includeRetired, in: query, schema: {type: boolean, default: false}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Страница по имени
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Ci'}}
                  nextCursor: {type: [string, 'null']}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [cis]
      summary: Создать КЕ (CFG)
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CiCreate'}
      responses:
        '201':
          description: Создана
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ci'}
        '400':
          description: |
            `unknown_class`, `abstract_class`, `unknown_attribute`, `invalid_attribute`, `attribute_required`,
            `unknown_group`, `secret_not_allowed` (CFG-08) — с `field`
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '403': {$ref: '#/components/responses/Problem'}

  /cmdb/cis/{id}:
    parameters:
      - {$ref: '#/components/parameters/CiId'}
    get:
      tags: [cis]
      summary: Карточка КЕ
      parameters:
        - name: at
          in: query
          description: Состояние на момент времени (CFG-06), ответ без ETag
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: КЕ
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ci'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      tags: [cis]
      summary: Изменить КЕ (CFG), JSON Merge Patch
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CiPatch'}
      responses:
        '200':
          description: Изменена
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ci'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}

  /cmdb/cis/{id}/relations:
    parameters:
      - {$ref: '#/components/parameters/CiId'}
    get:
      tags: [relations]
      summary: Активные связи КЕ с её стороны
      responses:
        '200':
          description: Связи по подписи
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Relation'}}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      tags: [relations]
      summary: Добавить связь (CFG)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [typeCode, targetId]
              properties:
                typeCode: {type: string, example: runs_on}
                targetId: {type: string, format: uuid, description: КЕ на другом конце}
                direction:
                  type: string
                  enum: [outgoing, incoming]
                  default: outgoing
                  description: outgoing — эта КЕ источник связи, incoming — цель
      responses:
        '201':
          description: Связь добавлена
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Relation'}
        '400':
          description: '`unknown_relation_type`, `unknown_ci`, `self_relation`, `ci_retired`'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409':
          description: '`relation_exists`'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}

  /cmdb/relations/{relationId}:
    delete:
      tags: [relations]
      summary: Снять связь (CFG); запись остаётся в истории с датой окончания
      parameters:
        - {name: relationId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Снята}
        '404': {$ref: '#/components/responses/Problem'}

  /cmdb/cis/{id}/impact:
    get:
      tags: [impact]
      summary: Анализ влияния отказа КЕ (CFG-09)
      parameters:
        - {$ref: '#/components/parameters/CiId'}
        - {name: depth, in: query, schema: {type: integer, minimum: 1, maximum: 5, default: 3}}
      responses:
        '200':
          description: Затронутые КЕ, услуги и видимые пользователю открытые заявки
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Impact'}
        '404': {$ref: '#/components/responses/Problem'}

  /cmdb/cis/{id}/history:
    get:
      tags: [cis]
      summary: История КЕ (CFG-06), новые первыми
      parameters:
        - {$ref: '#/components/parameters/CiId'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Страница истории
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string, format: uuid}
                        field: {type: string, description: 'created, name, class, status, environment, criticality, owner_group, description, attr.<код>, relation'}
                        oldValue: {}
                        newValue: {}
                        source: {type: string}
                        actorId: {type: [string, 'null'], format: uuid}
                        at: {type: string, format: date-time}
                  nextCursor: {type: [string, 'null']}

  /cmdb/cis/{id}/map:
    get:
      tags: [relations]
      summary: Карта связей (CFG-03) в обе стороны
      parameters:
        - {$ref: '#/components/parameters/CiId'}
        - {name: depth, in: query, schema: {type: integer, minimum: 1, maximum: 5, default: 2}}
        - {name: type, in: query, description: Коды типов связи через запятую, schema: {type: string}}
      responses:
        '200':
          description: Узлы и рёбра, до 300 КЕ
          content:
            application/json:
              schema:
                type: object
                properties:
                  rootId: {type: string, format: uuid}
                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        ci: {$ref: '#/components/schemas/CiRef'}
                        depth: {type: integer}
                        openIncidents: {type: integer}
                        openChanges: {type: integer}
                  edges:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string, format: uuid}
                        sourceId: {type: string, format: uuid}
                        targetId: {type: string, format: uuid}
                        typeCode: {type: string}
                        name: {type: string}
                        impactDirection: {type: string}
                  depth: {type: integer}
                  truncated: {type: boolean}

  /cmdb/quality:
    get:
      tags: [cis]
      summary: Показатели качества (CFG-07)
      responses:
        '200':
          description: Сводка
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: {type: integer}
                  incomplete: {type: integer}
                  stale: {type: integer}
                  orphans: {type: integer}
                  duplicateGroups: {type: integer}
                  duplicates: {type: integer}
                  score: {type: integer, minimum: 0, maximum: 100}

  /cmdb/quality/issues:
    get:
      tags: [cis]
      summary: КЕ с замечанием, до 200
      parameters:
        - {name: kind, in: query, required: true, schema: {type: string, enum: [incomplete, stale, orphan]}}
      responses:
        '200':
          description: КЕ
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/CiRef'}}

  /cmdb/quality/duplicates:
    get:
      tags: [cis]
      summary: Группы дубликатов, до 200
      responses:
        '200':
          description: Группы
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    key: {type: string, description: Атрибут идентификации или name}
                    value: {type: string}
                    cis: {type: array, items: {$ref: '#/components/schemas/CiRef'}}

  /cmdb/sources/{source}/batches:
    post:
      tags: [ingestion]
      summary: Пакетная загрузка из источника (CFG-04, CFG-05) — агент обнаружения, импорт, коннекторы
      parameters:
        - {name: source, in: path, required: true, schema: {type: string, example: discovery}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IngestBatch'}
      responses:
        '200':
          description: Пакет обработан
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IngestResult'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
    get:
      tags: [ingestion]
      summary: Последние пакеты источника без результатов по объектам
      parameters:
        - {name: source, in: path, required: true, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 20, maximum: 100}}
      responses:
        '200':
          description: Пакеты, новые первыми
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/IngestResult'}}

  /cmdb/sources/{source}/batches/{batchId}:
    get:
      tags: [ingestion]
      summary: Результат пакета
      parameters:
        - {name: source, in: path, required: true, schema: {type: string}}
        - {name: batchId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Результат
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IngestResult'}

  /cmdb/sources:
    get:
      tags: [ingestion]
      summary: Источники данных (CFG-04)
      responses:
        '200':
          description: Источники по приоритету
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Source'}}
    post:
      tags: [ingestion]
      summary: Завести источник (CFG, ADM)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, kind]
              properties:
                code: {type: string, pattern: '^[a-z][a-z0-9_-]{1,62}$', description: Не manual}
                name: {type: string}
                kind: {type: string, enum: [import, api, discovery, kubernetes, cloud]}
                priority: {type: integer, minimum: 1, maximum: 100, default: 20, description: 1 — самый доверенный, ручной ввод — 10}
                staleDays: {type: integer, minimum: 1, maximum: 3650, default: 30}
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Source'}
        '409': {$ref: '#/components/responses/Problem'}

  /cmdb/sources/{code}:
    get:
      tags: [ingestion]
      summary: Источник с ETag
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Источник
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Source'}
    patch:
      tags: [ingestion]
      summary: Изменить название, приоритет, срок актуальности, включить или отключить (If-Match)
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
        - {name: If-Match, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                priority: {type: integer, minimum: 1, maximum: 100}
                staleDays: {type: integer, minimum: 1, maximum: 3650}
                active: {type: boolean}
      responses:
        '200':
          description: Изменён
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Source'}
        '412': {$ref: '#/components/responses/Problem'}

  /cmdb/conflicts:
    get:
      tags: [ingestion]
      summary: Экран «Сверка» (CFG-05)
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [open, accepted, ignored, merged, dismissed, all], default: open}}
        - {name: kind, in: query, schema: {type: string, enum: [attribute, duplicate]}}
        - {name: source, in: query, schema: {type: string}}
        - {name: ciId, in: query, schema: {type: string, format: uuid}, description: КЕ или кандидат дубликата}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, maximum: 200}}
      responses:
        '200':
          description: Конфликты, новые первыми
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Conflict'}}
                  nextCursor: {type: [string, 'null']}

  /cmdb/conflicts/{id}/resolve:
    post:
      tags: [ingestion]
      summary: Разобрать конфликт (CFG)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [accept, ignore, merge]
                  description: attribute — accept или ignore; duplicate — accept, merge (с ciId) или ignore
                ciId: {type: string, format: uuid, description: Для duplicate — КЕ из candidates}
      responses:
        '200':
          description: Разобран
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Conflict'}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /cmdb/cis/{id}/merge:
    post:
      tags: [cis]
      summary: Слить дубликат в эту КЕ (CFG-07, CFG)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mergedId]
              properties:
                mergedId: {type: string, format: uuid}
      responses:
        '200':
          description: Остающаяся КЕ
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ci'}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: SESSION
      description: Сессия модуля identity. В профиле dev — заголовки X-Dev-User, X-Dev-Tenant, X-Dev-Roles.

  parameters:
    CiId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag записи; без него 428, с устаревшим 412
      schema: {type: string, example: '"3"'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: {type: string}

  headers:
    ETag:
      description: Версия записи в кавычках
      schema: {type: string, example: '"3"'}

  responses:
    Problem:
      description: Ошибка RFC 9457
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    Problem:
      type: object
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
        field: {type: string, description: Поле запроса с ошибкой, для атрибутов — код атрибута}
        trace_id: {type: string}

    Layer:
      type: string
      enum: [business_service, technical_service, application, infrastructure]

    AttributeDef:
      type: object
      properties:
        code: {type: string}
        name: {type: string}
        type: {type: string, enum: [string, text, number, boolean, date, ip, enum]}
        required: {type: boolean}
        options: {type: array, items: {type: string}}

    CiClass:
      type: object
      properties:
        id: {type: string, format: uuid}
        parentId: {type: [string, 'null'], format: uuid}
        code: {type: string, example: virtual_machine}
        name: {type: string}
        layer: {$ref: '#/components/schemas/Layer'}
        isAbstract: {type: boolean}
        system: {type: boolean}
        active: {type: boolean}
        attributes: {type: array, description: С унаследованными, items: {$ref: '#/components/schemas/AttributeDef'}}
        ownAttributes: {type: array, items: {$ref: '#/components/schemas/AttributeDef'}}
        identificationRules:
          type: array
          items: {type: array, items: {type: string}}
          example: [[serial_number], [fqdn], [hostname, domain]]
        version: {type: integer}

    RelationType:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        inverseName: {type: string}
        impactDirection: {type: string, enum: [target_to_source, source_to_target, none]}
        system: {type: boolean}
        active: {type: boolean}

    Ci:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        classCode: {type: string}
        className: {type: string}
        layer: {$ref: '#/components/schemas/Layer'}
        status: {type: string, enum: [planned, active, maintenance, retired]}
        environment: {type: [string, 'null'], example: production}
        criticality: {type: string, enum: [low, medium, high, critical]}
        ownerGroupId: {type: [string, 'null'], format: uuid}
        description: {type: string}
        attributes: {type: object, additionalProperties: true}
        attributeSources:
          type: object
          additionalProperties: {type: string}
          description: Источник значения каждого атрибута, manual — ручной ввод
        lastSeenAt: {type: [string, 'null'], format: date-time, description: Последний раз видел источник данных}
        mergedInto: {type: [string, 'null'], format: uuid, description: У слитого дубликата — КЕ, в которую он слит}
        createdAt: {type: string, format: date-time}
        createdBy: {type: [string, 'null'], format: uuid}
        updatedAt: {type: string, format: date-time}
        updatedBy: {type: [string, 'null'], format: uuid}
        version: {type: integer}

    CiCreate:
      type: object
      required: [name, classCode]
      properties:
        name: {type: string, maxLength: 255}
        classCode: {type: string}
        status: {type: string, enum: [planned, active, maintenance, retired], default: active}
        environment: {type: string, pattern: '^[a-z][a-z0-9_]{0,31}$'}
        criticality: {type: string, enum: [low, medium, high, critical], default: medium}
        ownerGroupId: {type: string, format: uuid}
        description: {type: string, maxLength: 10000}
        attributes: {type: object, additionalProperties: true}

    CiPatch:
      type: object
      description: Отсутствующее поле не меняется; null очищает environment, ownerGroupId, description и атрибут
      properties:
        name: {type: string}
        classCode: {type: string, description: При смене класса остаются только атрибуты нового класса}
        status: {type: string, enum: [planned, active, maintenance, retired]}
        environment: {type: [string, 'null']}
        criticality: {type: string, enum: [low, medium, high, critical]}
        ownerGroupId: {type: [string, 'null'], format: uuid}
        description: {type: [string, 'null']}
        attributes: {type: object, additionalProperties: true, description: Только изменяемые атрибуты}

    CiLink:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        classCode: {type: string}
        className: {type: string}
        layer: {$ref: '#/components/schemas/Layer'}
        status: {type: string}

    Relation:
      type: object
      properties:
        id: {type: string, format: uuid}
        typeCode: {type: string}
        label: {type: string, description: Название типа для outgoing, обратное — для incoming}
        direction: {type: string, enum: [outgoing, incoming]}
        impactDirection: {type: string, enum: [target_to_source, source_to_target, none]}
        other: {$ref: '#/components/schemas/CiLink'}
        origin: {type: string, description: manual или код источника данных}
        validFrom: {type: string, format: date-time}

    CiRef:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        classCode: {type: string}
        className: {type: string}
        layer: {$ref: '#/components/schemas/Layer'}
        status: {type: string}
        environment: {type: [string, 'null']}
        criticality: {type: string}
        ownerGroupId: {type: [string, 'null'], format: uuid}

    Impacted:
      type: object
      properties:
        ci: {$ref: '#/components/schemas/CiRef'}
        depth: {type: integer, description: 0 для исходной КЕ-услуги}
        path: {type: array, items: {type: string, format: uuid}, description: От исходной КЕ до этой}

    Impact:
      type: object
      properties:
        roots: {type: array, items: {$ref: '#/components/schemas/CiRef'}}
        impacted: {type: array, items: {$ref: '#/components/schemas/Impacted'}}
        services: {type: array, items: {$ref: '#/components/schemas/Impacted'}}
        tickets:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              number: {type: string}
              title: {type: string}
              type: {type: string}
              priority: {type: string}
              statusCategory: {type: string}
              ciId: {type: [string, 'null'], format: uuid}
              serviceId: {type: [string, 'null'], format: uuid}
        hiddenTickets: {type: integer, description: Открытые заявки, которые пользователь не видит}
        depth: {type: integer}
        truncated: {type: boolean}

    IngestBatch:
      type: object
      required: [batchId, items]
      properties:
        batchId: {type: string, pattern: '^[A-Za-z0-9._:-]{1,200}$', description: Уникален в источнике, повтор идемпотентен}
        runId: {type: string, description: Пакеты одного полного обхода}
        final: {type: boolean, default: false, description: Последний пакет обхода, нужен runId}
        items:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [externalId, classCode, name]
            properties:
              externalId: {type: string, maxLength: 255}
              classCode: {type: string}
              name: {type: string}
              status: {type: string}
              environment: {type: string}
              attributes: {type: object, additionalProperties: true}
              relations:
                type: array
                description: Заменяют связи, которые этот источник объявил у этой КЕ; null — не трогать
                items:
                  type: object
                  required: [typeCode, target]
                  properties:
                    typeCode: {type: string}
                    direction: {type: string, enum: [outgoing, incoming], default: outgoing}
                    target:
                      type: object
                      properties:
                        externalId: {type: string}
                        ciId: {type: string, format: uuid}
        removed: {type: array, items: {type: string}, description: externalId, которые источник больше не видит}

    IngestResult:
      type: object
      properties:
        batchId: {type: string}
        runId: {type: [string, 'null']}
        final: {type: boolean}
        status: {type: string, enum: [done]}
        received: {type: integer}
        created: {type: integer}
        updated: {type: integer}
        unchanged: {type: integer}
        conflicts: {type: integer, description: Поднятые конфликты сверки}
        errors: {type: integer}
        removed: {type: integer}
        createdAt: {type: string, format: date-time}
        results:
          type: array
          items:
            type: object
            properties:
              externalId: {type: string}
              ciId: {type: [string, 'null'], format: uuid}
              outcome: {type: string, enum: [created, updated, unchanged, conflict, error, removed, not_found]}
              code: {type: [string, 'null']}
              field: {type: [string, 'null']}
              conflicts: {type: integer}
              warnings:
                type: array
                items:
                  type: object
                  properties:
                    code: {type: string, enum: [unknown_relation_type, unknown_target, self_relation, relations_failed]}
                    field: {type: string}

    Source:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        kind: {type: string, enum: [import, api, discovery, kubernetes, cloud]}
        priority: {type: integer}
        staleDays: {type: integer}
        active: {type: boolean}
        records: {type: integer, description: Объекты источника, связанные с КЕ}
        lastBatchAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer}

    Conflict:
      type: object
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [attribute, duplicate]}
        status: {type: string, enum: [open, accepted, ignored, merged, dismissed]}
        source: {type: object, properties: {code: {type: string}, name: {type: string}}}
        externalId: {type: string}
        ci: {oneOf: [{$ref: '#/components/schemas/CiRef'}, {type: 'null'}]}
        attribute: {type: [string, 'null']}
        currentValue: {description: Текущее значение в КЕ}
        proposedValue: {description: Значение источника}
        currentSource: {type: [string, 'null'], description: Владелец текущего значения}
        candidates: {type: array, items: {$ref: '#/components/schemas/CiRef'}}
        itemName: {type: [string, 'null']}
        itemClassCode: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        resolvedAt: {type: [string, 'null'], format: date-time}
        resolvedBy: {type: [string, 'null'], format: uuid}
        version: {type: integer}
