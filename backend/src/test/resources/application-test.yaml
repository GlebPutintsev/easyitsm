# Тесты работают с настоящим PostgreSQL: RLS нельзя проверить на H2.
# Локально: deploy/compose (docker compose up postgres) или свой PostgreSQL с deploy/compose/postgres/init.sql.
spring:
  datasource:
    url: ${EASYITSM_TEST_DB_URL:jdbc:postgresql://localhost:5432/easyitsm_test}
  flyway:
    locations: classpath:db/migration,classpath:db/dev
    clean-disabled: false
easyitsm:
  tenancy:
    mode: MULTI
  security:
    dev-auth:
      enabled: true
  identity:
    lockout:
      # Без задержек после неудачного входа, чтобы тесты шли быстро. Сама задержка проверяется отдельно.
      failure-delay: 0ms
  # Поиск в тестах по умолчанию без OpenSearch (резервный путь). Тесты OpenSearch включают его сами,
  # если задан EASYITSM_TEST_OPENSEARCH_URL.
  search:
    opensearch:
      enabled: false
  # Вложения: S3 из EASYITSM_TEST_S3_ENDPOINT (MinIO, moto). Антивирус — clamd, если задан EASYITSM_TEST_CLAMD_HOST.
  attachments:
    s3:
      endpoint: ${EASYITSM_TEST_S3_ENDPOINT:http://localhost:9000}
      bucket: easyitsm-test-files
      access-key: test
      secret-key: test # gitleaks:allow
      create-bucket: true
    antivirus:
      mode: none
