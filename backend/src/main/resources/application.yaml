spring:
  application:
    name: easyitsm-core
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${EASYITSM_DB_URL:jdbc:postgresql://localhost:5432/easyitsm}
    username: ${EASYITSM_DB_APP_USER:easyitsm_app}
    password: ${EASYITSM_DB_APP_PASSWORD:app}
  flyway:
    user: ${EASYITSM_DB_OWNER_USER:easyitsm_owner}
    password: ${EASYITSM_DB_OWNER_PASSWORD:owner}
    # Flyway обходит подпапки рекурсивно: каждый модуль кладёт миграции в db/migration/<модуль>/.
    locations: classpath:db/migration
    # Модули разрабатываются параллельно, версии миграций — метка времени. Порядок слияния веток не важен.
    out-of-order: true
    placeholders:
      app_role: ${EASYITSM_DB_APP_USER:easyitsm_app}
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: true
  mvc:
    problemdetails:
      enabled: true

easyitsm:
  tenancy:
    mode: SINGLE
  worker:
    # Роль фонового обработчика: outbox, таймеры SLA, почта, очистка. В HA-установке
    # включается на отдельных подах, на пилоте работает в том же процессе.
    enabled: true
  security:
    dev-auth:
      enabled: false
  # Вход и сессии (модуль identity). Все параметры и значения по умолчанию: IdentityProperties.
  identity:
    secret-key: ${EASYITSM_IDENTITY_SECRET_KEY:}
    public-url: ${EASYITSM_PUBLIC_URL:http://localhost:5173}
    webauthn:
      rp-id: ${EASYITSM_WEBAUTHN_RP_ID:localhost}
    bootstrap:
      admin-login: ${EASYITSM_BOOTSTRAP_ADMIN_LOGIN:}
      admin-password: ${EASYITSM_BOOTSTRAP_ADMIN_PASSWORD:}
      admin-email: ${EASYITSM_BOOTSTRAP_ADMIN_EMAIL:}
  # Глобальный поиск. Без OpenSearch (пилот) работает резервный поиск PostgreSQL. Параметры: SearchProperties.
  search:
    opensearch:
      enabled: ${EASYITSM_SEARCH_OPENSEARCH_ENABLED:false}
      urls: ${EASYITSM_SEARCH_OPENSEARCH_URLS:http://localhost:9200}
      username: ${EASYITSM_SEARCH_OPENSEARCH_USERNAME:}
      # Пароль — файлом EASYITSM_SEARCH_OPENSEARCH_PASSWORD в /run/secrets/easyitsm (configtree).
      password: ${EASYITSM_SEARCH_OPENSEARCH_PASSWORD:}
      replicas: ${EASYITSM_SEARCH_OPENSEARCH_REPLICAS:0}
  # Вложения в S3 и антивирус. Параметры: AttachmentProperties.
  attachments:
    s3:
      endpoint: ${EASYITSM_ATTACHMENTS_S3_ENDPOINT:http://localhost:9000}
      public-endpoint: ${EASYITSM_ATTACHMENTS_S3_PUBLIC_ENDPOINT:}
      region: ${EASYITSM_ATTACHMENTS_S3_REGION:ru-central1}
      bucket: ${EASYITSM_ATTACHMENTS_S3_BUCKET:easyitsm-files}
      access-key: ${EASYITSM_ATTACHMENTS_S3_ACCESS_KEY:}
      # Секрет — файлом EASYITSM_ATTACHMENTS_S3_SECRET_KEY в /run/secrets/easyitsm (configtree).
      secret-key: ${EASYITSM_ATTACHMENTS_S3_SECRET_KEY:}
    antivirus:
      mode: ${EASYITSM_ATTACHMENTS_ANTIVIRUS_MODE:clamd}
      host: ${EASYITSM_ATTACHMENTS_ANTIVIRUS_HOST:localhost}
      port: ${EASYITSM_ATTACHMENTS_ANTIVIRUS_PORT:3310}
  # Канал почты (модуль mail). Параметры и значения по умолчанию: MailProperties.
  mail:
    # Ключ шифрования паролей ящиков; пусто — используется easyitsm.identity.secret-key.
    secret-key: ${EASYITSM_MAIL_SECRET_KEY:}
    # Отправка по умолчанию для арендаторов без своей настройки (установка с одним арендатором).
    fallback:
      host: ${EASYITSM_SMTP_HOST:}
      port: ${EASYITSM_SMTP_PORT:587}
      security: ${EASYITSM_SMTP_SECURITY:starttls}
      username: ${EASYITSM_SMTP_USERNAME:}
      password: ${EASYITSM_SMTP_PASSWORD:}
      from-address: ${EASYITSM_SMTP_FROM:}
      from-name: ${EASYITSM_SMTP_FROM_NAME:Easy ITSM}
    inbound-smtp:
      enabled: ${EASYITSM_INBOUND_SMTP_ENABLED:false}
      port: ${EASYITSM_INBOUND_SMTP_PORT:2525}
  # Уведомления (модуль notifications). Параметры: NotificationProperties.
  notifications:
    public-url: ${EASYITSM_PUBLIC_URL:http://localhost:5173}
    push-enabled: ${EASYITSM_PUSH_ENABLED:true}
    push-subject: ${EASYITSM_PUSH_SUBJECT:mailto:support@easyitsm.local}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

server:
  error:
    include-stacktrace: never
    include-message: never
  shutdown: graceful

logging:
  pattern:
    correlation: "[%X{trace_id:-}] "
---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/dev
easyitsm:
  tenancy:
    default-tenant-id: 01930000-0000-7000-8000-000000000001
  security:
    dev-auth:
      enabled: true
  identity:
    # Ключ только для разработки. В поставке задаётся EASYITSM_IDENTITY_SECRET_KEY.
    secret-key: ZGV2LW9ubHktZWFzeWl0c20tc2VjcmV0LWtleS0zMmI= # gitleaks:allow
    session:
      # Разработка по http://localhost: без Secure и префикса __Host-.
      secure-cookie: false
    mfa:
      # Демо-пользователи входят без обязательной настройки MFA. В поставке MFA обязательна (SEC-02).
      enforced: false
  attachments:
    s3:
      # MinIO из deploy/compose. В поставке ключи задаются секретом.
      access-key: ${EASYITSM_ATTACHMENTS_S3_ACCESS_KEY:easyitsm}
      secret-key: ${EASYITSM_ATTACHMENTS_S3_SECRET_KEY:easyitsm-dev-secret} # gitleaks:allow
      create-bucket: true
    antivirus:
      # ClamAV в compose запускается профилем av (docker compose --profile av up -d clamav), он тяжёлый.
      # Без него файлы проходят проверки содержимого и архивов и помечаются «не проверен антивирусом».
      mode: ${EASYITSM_ATTACHMENTS_ANTIVIRUS_MODE:none}
  mail:
    # Письма уходят в Mailpit из deploy/compose: http://localhost:8025
    fallback:
      host: localhost
      port: 1025
      security: none
      from-address: support@easyitsm.local
    # Входящий SMTP для ручной проверки: swaks --server localhost:2525 --to support@easyitsm.local
    inbound-smtp:
      enabled: true
      port: 2525
---
# Вход через Keycloak из deploy/compose (docker compose --profile sso up keycloak), реалм easyitsm.
# Запуск: --spring.profiles.active=dev,sso
spring:
  config:
    activate:
      on-profile: sso
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-name: Keycloak
            client-id: easyitsm
            client-secret: easyitsm-dev-secret # gitleaks:allow
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/v1/auth/oidc/callback/{registrationId}"
        provider:
          keycloak:
            # Явные адреса вместо issuer-uri: приложение стартует, даже если Keycloak ещё не запущен.
            authorization-uri: http://localhost:8180/realms/easyitsm/protocol/openid-connect/auth
            token-uri: http://localhost:8180/realms/easyitsm/protocol/openid-connect/token
            jwk-set-uri: http://localhost:8180/realms/easyitsm/protocol/openid-connect/certs
            user-info-uri: http://localhost:8180/realms/easyitsm/protocol/openid-connect/userinfo
            user-name-attribute: sub
