spring:
  application:
    name: easyitsm-core
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${EASYITSM_DB_URL:jdbc:postgresql://localhost:5432/easyitsm}
    username: ${EASYITSM_DB_APP_USER:easyitsm_app}
    password: ${EASYITSM_DB_APP_PASSWORD:app}
  flyway:
    user: ${EASYITSM_DB_OWNER_USER:easyitsm_owner}
    password: ${EASYITSM_DB_OWNER_PASSWORD:owner}
    # Flyway обходит подпапки рекурсивно: каждый модуль кладёт миграции в db/migration/<модуль>/.
    locations: classpath:db/migration
    # Модули разрабатываются параллельно, версии миграций — метка времени. Порядок слияния веток не важен.
    out-of-order: true
    placeholders:
      app_role: ${EASYITSM_DB_APP_USER:easyitsm_app}
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: true
  mvc:
    problemdetails:
      enabled: true

easyitsm:
  tenancy:
    mode: SINGLE
  worker:
    # Роль фонового обработчика: outbox, таймеры SLA, почта, очистка. В HA-установке
    # включается на отдельных подах, на пилоте работает в том же процессе.
    enabled: true
  security:
    dev-auth:
      enabled: false
  # Вход и сессии (модуль identity). Все параметры и значения по умолчанию: IdentityProperties.
  identity:
    secret-key: ${EASYITSM_IDENTITY_SECRET_KEY:}
    public-url: ${EASYITSM_PUBLIC_URL:http://localhost:5173}
    webauthn:
      rp-id: ${EASYITSM_WEBAUTHN_RP_ID:localhost}
    bootstrap:
      admin-login: ${EASYITSM_BOOTSTRAP_ADMIN_LOGIN:}
      admin-password: ${EASYITSM_BOOTSTRAP_ADMIN_PASSWORD:}
      admin-email: ${EASYITSM_BOOTSTRAP_ADMIN_EMAIL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

server:
  error:
    include-stacktrace: never
    include-message: never
  shutdown: graceful

logging:
  pattern:
    correlation: "[%X{trace_id:-}] "
---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/dev
easyitsm:
  tenancy:
    default-tenant-id: 01930000-0000-7000-8000-000000000001
  security:
    dev-auth:
      enabled: true
  identity:
    # Ключ только для разработки. В поставке задаётся EASYITSM_IDENTITY_SECRET_KEY.
    secret-key: ZGV2LW9ubHktZWFzeWl0c20tc2VjcmV0LWtleS0zMmI= # gitleaks:allow
    session:
      # Разработка по http://localhost: без Secure и префикса __Host-.
      secure-cookie: false
    mfa:
      # Демо-пользователи входят без обязательной настройки MFA. В поставке MFA обязательна (SEC-02).
      enforced: false
---
# Вход через Keycloak из deploy/compose (docker compose --profile sso up keycloak), реалм easyitsm.
# Запуск: --spring.profiles.active=dev,sso
spring:
  config:
    activate:
      on-profile: sso
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-name: Keycloak
            client-id: easyitsm
            client-secret: easyitsm-dev-secret # gitleaks:allow
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/v1/auth/oidc/callback/{registrationId}"
        provider:
          keycloak:
            # Явные адреса вместо issuer-uri: приложение стартует, даже если Keycloak ещё не запущен.
            authorization-uri: http://localhost:8180/realms/easyitsm/protocol/openid-connect/auth
            token-uri: http://localhost:8180/realms/easyitsm/protocol/openid-connect/token
            jwk-set-uri: http://localhost:8180/realms/easyitsm/protocol/openid-connect/certs
            user-info-uri: http://localhost:8180/realms/easyitsm/protocol/openid-connect/userinfo
            user-name-attribute: sub
